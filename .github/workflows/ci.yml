name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Route types (LayoutProps etc.) are generated, not checked in.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx vitest run
      # RLS + audit-immutability verification against real migrations (§9)
      - run: bash scripts/test-rls.sh
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
